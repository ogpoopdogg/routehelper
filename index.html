<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E&C ROUTE PLANNER</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="gold">
    <link href="//fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* All CSS remains unchanged from the previous version */
        :root {
            --accent: #facc15; --bg: #111827; --card: #1f2937; --text: #f9fafb; --card-text: #e5e7eb;
            --active-green: #22c55e; --archive-orange: #f97316; --note-blue: #3b82f6; --pro-blue: #2563eb;
            --header-bg: #030712; --input-bg: #374151; --border: #4b5563; --modal-bg: #111827;
            --shadow-soft: 0 10px 15px -3px rgba(0,0,0,0.3), 0 4px 6px -4px rgba(0,0,0,0.3);
        }
        body.light-mode {
            --bg: #f3f4f6; --card: #ffffff; --text: #111827; --card-text: #374151; --header-bg: #ffffff;
            --input-bg: #f9fafb; --border: #e5e7eb; --modal-bg: #ffffff; --accent: #2563eb; --active-green: #16a34a;
        }
        body.light-mode * { color: #000 !important; }
        body.light-mode button { background: #fff !important; color: #000 !important; border: 1px solid #ccc !important; }
        body.light-mode .primary { background: #fff !important; border: 2px solid #00b32d !important; }
        body.light-mode .map-btn svg { stroke: #000 !important; }
        body.light-mode #map-btn { background: #fff !important; border: 1px solid #333 !important; font-size: 12px !important; color: #000 !important; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        body.light-mode #map-btn::after { content: "MAP"; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        header { padding: 16px 24px; background: var(--header-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-soft); }
        .header-logo { height: 24px; width: auto; margin-right: 12px; vertical-align: middle; filter: drop-shadow(0 0 3px var(--accent)); cursor: pointer; }
        .shiny-text { background: linear-gradient(to right, var(--accent) 20%, #ccc 50%, var(--accent) 80%); background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: text-shine 3s linear infinite; }
        @keyframes text-shine { to { background-position: 200% center; } }

        #login-overlay { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { width: 100%; max-width: 350px; background: #111; padding: 40px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .login-input { width: 100%; padding: 14px; margin: 12px 0; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 16px; outline: none; }
        .login-submit { width: 100%; padding: 14px; margin-top: 20px; background: var(--accent); border: none; color: #000; font-weight: 700; border-radius: 6px; cursor: pointer; text-transform: uppercase; }

        .flex-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-wrap { position: relative; flex: 1; }
        input, select, textarea { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(250,204,21,0.2); }
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: var(--card); border: 1px solid var(--border); z-index: 5000; max-height: 200px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 14px; border-bottom: 1px solid var(--border); cursor: pointer; color: var(--text); }
        .suggestion-item:hover { background: var(--accent); color: #000; }
        .suggestion-reset { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 9px; font-weight: 700; cursor: pointer; color: #666; text-transform: uppercase; z-index: 10; }

        #map-modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
        #map { width: 100%; height: 100%; }
        .close-map { position: fixed; top: 20px; right: 20px; z-index: 3005; background: #b71c1c; color: #fff; border: none; width: 140px; height: 40px; font-weight: 700; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #zoom-out-btn { top: 70px; background: #448800; }
        #reset-driver-view-btn { position: absolute; bottom: 20px; left: 20px; z-index: 3005; background: #222; color: #fff; border: 1px solid #fff; border-radius: 6px; padding: 8px 12px; font-weight: 700; cursor: pointer; display: none; }

        .primary { padding: 14px 16px; background: var(--btn-bg, #374151); color: var(--text); font-weight: 700; border: 1px solid var(--border); border-bottom: 3px solid var(--accent); cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        .btn-add { background: var(--active-green); color: #000; border: none; padding: 14px 24px; font-weight: 700; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-clear { background: #b71c1c; color: #fff; border: none; padding: 8px 16px; font-weight: 700; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-save { background: #2563eb; color: #fff; border: none; padding: 8px 16px; font-weight: 700; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-delete-all-saved { background: #f97316; color: #fff; border: none; padding: 8px 16px; font-weight: 700; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 12px; }

        #job-list-container { background: var(--card); border-radius: 12px; padding: 15px; margin: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-soft); }
        #job-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
        .job-item { display: flex; align-items: center; gap: 12px; background: var(--input-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); cursor: default; user-select: none; -webkit-user-select: none; position: relative; }
        .job-number { background: #fff; color: #000; font-weight: 900; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .job-info { flex: 1; overflow: hidden; }
        .job-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .job-address { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .job-item.pending { background: #f9731644; border-left: 4px solid #f97316; }
        .job-item .pending-badge { font-size: 10px; background: #f97316; color: #000; padding: 2px 8px; border-radius: 12px; font-weight: 700; margin-left: 8px; }

        .create-route-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: box-shadow 0.3s, background 0.2s;
            display: block;
            margin: 0 auto 10px auto;
            width: fit-content;
            min-width: 200px;
        }
        .create-route-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none !important;
        }
        .create-route-btn.active {
            background: #ff6600;
            box-shadow: 0 0 20px #ff6600;
        }
        .create-route-btn.pulse-glow {
            animation: pulseGlow 1.5s infinite;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px #2563eb; }
            50% { box-shadow: 0 0 25px #3b82f6, 0 0 40px #2563eb; }
            100% { box-shadow: 0 0 5px #2563eb; }
        }
        .create-route-btn.map-modal-btn {
            position: fixed;
            top: 80px;
            left: 10px;
            z-index: 3005;
            width: 140px;
            height: 40px;
            padding: 0;
            font-size: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .create-route-btn.map-modal-btn.active {
            background: #ff6600;
        }

        .delete-icon { width: 20px; height: 20px; cursor: pointer; fill: #b71c1c; z-index: 2; }

        #install-btn { display: none; background: var(--pro-blue); color: #fff; border: none; padding: 14px 16px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; text-transform: uppercase; position: fixed; right: 15px; bottom: 15px; z-index: 1002; }

        .map-btn {
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 4px, transparent 4px, transparent 8px), #2c3e50;
            color: white;
            border: 1px solid #fff;
            padding: 6px 8px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0;
            line-height: 1;
            min-width: 36px;
            min-height: 36px;
        }
        .map-btn-glow { box-shadow: 0 0 15px var(--accent); }

        .driver-map-label { color: #00ff00 !important; font-weight: 700; text-shadow: 0 0 2px #000; }
        .driver-map-label-pending { color: #ff9800 !important; font-weight: 700; text-shadow: 0 0 2px #000; }

        .eta-glow { border-color: #00bfff !important; box-shadow: 0 0 15px #00bfff; }

        .bullseye-btn {
            background: #fff;
            border: 2px solid #333;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            outline: none;
            margin: 0 0 8px 0;
        }
        .bullseye-btn.active { border-color: #ff6600; background: #ffcc00; }

        #address-picker-modal {
            display: none;
            position: fixed;
            z-index: 4000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: #111;
        }
        #address-picker-modal .picker-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0,0,0,0.7);
            padding: 10px 16px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        #address-picker-modal .picker-header input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #address-picker-modal .picker-header input:focus { border-color: var(--accent); }
        #address-picker-modal .picker-close {
            background: #b71c1c;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #address-picker-modal .picker-map { width: 100%; height: 100%; }
        #address-picker-modal .picker-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(4px);
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            z-index: 10;
            min-width: 200px;
        }
        #address-picker-modal .picker-info .addr-detail { font-size: 14px; word-break: break-word; }
        #address-picker-modal .picker-info .plus-code {
            font-size: 12px;
            color: #aaa;
            background: #222;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #555;
        }
        #address-picker-modal .picker-info .picker-confirm {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .address-pin-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 20px;
            line-height: 1;
        }
        .address-pin-btn svg { width: 22px; height: 22px; fill: var(--accent); stroke: #333; stroke-width: 1; }
        .address-pin-btn:hover { opacity: 0.8; }

        @media (max-width: 768px) {
            header { padding: 8px 12px; }
            .header-logo { height: 20px; }
            #address-picker-modal .picker-header { flex-wrap: wrap; }
            #address-picker-modal .picker-info { bottom: 20px; min-width: auto; width: 90%; }
            .create-route-btn { width: 90%; }
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color:var(--accent);">ROUTE PLANNER LOGIN</h2>
            <input type="email" id="login-user" class="login-input" placeholder="Email" autofocus>
            <input type="password" id="login-pin" class="login-input" placeholder="Password">
            <button class="login-submit" onclick="attemptLogin()">Authorize</button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div style="display: flex; align-items: center; gap: 10px; flex-shrink:0;">
            <img src="icon2.png" class="header-logo" alt="Logo" onclick="toggleTheme()">
            <span class="shiny-text" style="font-size:16px; font-weight:700;">E&C ROUTE PLANNER</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; margin-left: auto;">
            <button id="route-btn" class="map-btn" onclick="openExternalRoute()" aria-label="Route"><svg viewBox="0 0 24 24" width="20" height="20" stroke="white" fill="none" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>
            <button id="eta-btn" class="map-btn" onclick="calculateETAOnDemand()" aria-label="Calculate ETA" title="Calculate ETA and distance">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="white" fill="none" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                    <line x1="12" y1="2" x2="12" y2="4"/>
                    <line x1="12" y1="20" x2="12" y2="22"/>
                    <line x1="2" y1="12" x2="4" y2="12"/>
                    <line x1="20" y1="12" x2="22" y2="12"/>
                </svg>
            </button>
            <button id="map-btn" class="map-btn" onclick="openMap()" aria-label="Map" style="background: url('//mt.google.com/vt/lyrs=m&x=235&y=348&z=10') center/cover; border: 1px solid #fff;"></button>
        </div>
    </header>

    <!-- Input fields -->
    <div style="padding: 20px;">
        <div style="background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-soft);">
            <div class="flex-row">
                <div class="rel" style="position: relative; width: 100%;">
                    <input type="text" id="f-name" class="glow-field" placeholder="Contact/Business Name" autocomplete="off" oninput="handleNameInput(this.value)" onblur="setTimeout(()=>document.getElementById('suggestions').style.display='none', 200)" style="padding-right:50px;">
                    <div id="suggestions" class="suggestions-box"></div>
                    <div onclick="resetFormFields()" class="suggestion-reset" style="right:36px;">RESET</div>
                </div>
            </div>
            <div class="flex-row">
                <div class="input-wrap" style="flex: 0.7; position: relative;">
                    <input type="text" id="f-address" placeholder="Address">
                    <button class="address-pin-btn" onclick="openAddressPicker()" aria-label="Pick address from map">
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                    </button>
                </div>
                <div class="input-wrap" style="flex: 0.3;">
                    <input type="text" id="f-city" placeholder="City" oninput="handleCityInput(this.value)">
                    <div id="city-suggestions" class="suggestions-box"></div>
                </div>
            </div>
            <button class="btn-add" onclick="addJob()" style="width:100%; margin-top:10px;">ADD TO ROUTE</button>
        </div>

        <!-- CREATE ROUTE button (main page) -->
        <button id="create-route-main" class="create-route-btn" style="margin-top: 15px;" onclick="startCreateRoute()">CREATE ROUTE</button>

        <!-- ETA Display -->
        <div id="eta-display" style="margin-top:15px; background:var(--card); border-radius:12px; padding:12px; border:1px solid var(--border); display:none; color:var(--text);">
            <span>Total ETA: <span id="eta-time">0</span> <span id="eta-adjusted" style="color:#ff8c00; display:none;">(<span id="eta-adjusted-time">0</span>)</span> <span id="eta-distance-display" style="display:inline;">| <span id="eta-distance">0</span> km</span></span>
        </div>

        <!-- Job List Container -->
        <div id="job-list-container">
            <h3 style="margin-top:0; color:var(--accent); display: flex; align-items: center; gap: 8px;">
                ROUTE STOPS
                <span id="stop-counter" style="display:none; border:2px solid white; color:#ff8c00; font-weight:bold; padding:0 8px; border-radius:12px; font-size:14px;"></span>
            </h3>
            <div id="job-list"></div>
            <div id="empty-state" style="text-align:center; color:#666; padding:20px;">No jobs added. Use the form above to add stops.</div>
        </div>
    </div>

    <!-- Map Modal -->
    <div id="map-modal">
        <button id="close-map-btn" class="close-map" onclick="closeMap()">CLOSE MAP</button>
        <button id="zoom-out-btn" class="close-map" onclick="zoomToAll()" style="top:70px; background:#448800;">ZOOM OUT</button>
        <!-- CREATE ROUTE button inside map -->
        <button id="create-route-map" class="create-route-btn map-modal-btn" onclick="startCreateRoute()">CREATE ROUTE</button>
        <button id="reset-driver-view-btn" onclick="resetMapView()" style="display:none;">← BACK</button>
        <div id="map"></div>
    </div>

    <!-- Address Picker Modal -->
    <div id="address-picker-modal">
        <div class="picker-header">
            <input type="text" id="picker-search" placeholder="Search for a town, city, or area..." autocomplete="off" style="flex:1;">
            <button id="picker-go-btn" style="background:#22c55e; color:#000; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="searchAddressPicker()">Go</button>
            <button class="picker-close" onclick="closeAddressPicker()">✕</button>
        </div>
        <div id="picker-map" class="picker-map"></div>
        <div class="picker-info" id="picker-info">
            <div class="addr-detail" id="picker-address-display">Select a location on the map</div>
            <div class="plus-code" id="picker-pluscode-display">Plus Code: —</div>
            <button class="picker-confirm" id="picker-confirm-btn" onclick="confirmAddress()">Use this address</button>
        </div>
    </div>

    <!-- Install App Button -->
    <button id="install-btn">Install App</button>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA6umETP8wBUEV41ugAtiNiChUeLmmwmZI&libraries=geometry,drawing,places&callback=initMap" async defer></script>

    <script>
        // Firebase config
        firebase.initializeApp({
            apiKey: "AIzaSyAKmgoXA4m3cRTmxJq4aUyva5SVvFbTNqg",
            authDomain: "eandccourier-36fcc.firebaseapp.com",
            databaseURL: "https://eandccourier-36fcc-default-rtdb.firebaseio.com",
            projectId: "eandccourier-36fcc",
            messagingSenderId: "1067680083511",
            appId: "1:1067680083511:android:22d1eb3757302492bd19b2"
        });
        const auth = firebase.auth();
        const db = firebase.database();

        // Global variables
        let currentUser = null;
        let currentRouteKey = null;
        let jobs = {};
        let addressData = {};
        let map, mainMap, mapMarkers = {}, activePolyline = null;
        let autocompleteAddress;
        let etaTotalMinutes = 0, etaTotalKm = 0;

        // New ordering state
        let routeState = {
            order: [],
            isFinalized: false,
            assignedIndices: {}
        };
        let isOrderingMode = false;
        let pulsingMarkers = {};
        let createRouteMainBtn, createRouteMapBtn;

        // Other globals
        let etaCalculating = false;
        let isTracking = false;
        let userMarker = null, userCircle = null, locationWatchId = null;
        let pickerMap = null, pickerMarker = null, pickerGeocoder = null, pickerAutocomplete = null, pickerInitialized = false;
        let selectedLocation = null;
        let arrowMarkers = [];
        let originMarker = null;

        // Theme
        if (localStorage.getItem('ec_theme') === 'light') document.body.classList.add('light-mode');
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('ec_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            if (map) map.setOptions({ styles: document.body.classList.contains('light-mode') ? [] : mapStyles });
        }
        const mapStyles = [{"featureType":"all","elementType":"all","stylers":[{"invert_lightness":!0},{"saturation":10},{"lightness":30},{"gamma":0.5},{"hue":"#435158"}]}];

        // ---------- LOGIN ----------
        function attemptLogin() {
            const email = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pin').value.trim();
            if (!email || !pass) return;
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                .then(() => auth.signInWithEmailAndPassword(email, pass))
                .catch(err => alert("Login Failed: " + err.message));
        }
        auth.onAuthStateChanged(user => {
            if (user) {
                const email = user.email;
                const username = email.split('@')[0].toLowerCase();
                db.ref(`roles/${username}/command`).once('value').then(snap => {
                    if (snap.val() === true) {
                        db.ref('developer/route_planner/saved_routes').once('value').then(routesSnap => {
                            const routesData = routesSnap.val() || {};
                            const existingKey = Object.keys(routesData).find(k => {
                                const r = routesData[k];
                                return r && r.label && r.label.toLowerCase().trim() === username.toLowerCase().trim();
                            });
                            currentUser = username.charAt(0).toUpperCase() + username.slice(1);
                            currentRouteKey = existingKey || currentUser;
                            console.log('Resolved currentUser key for route lookup:', currentRouteKey);
                            document.getElementById('login-overlay').style.display = 'none';
                            initApp();
                        });
                    } else {
                        alert("ACCESS DENIED");
                        auth.signOut();
                        document.getElementById('login-overlay').style.display = 'flex';
                    }
                });
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        });

        function initApp() {
            db.ref('address_lookup').on('value', snap => { addressData = snap.val() || {}; });
            db.ref('developer/route_planner/jobs').on('value', snap => {

        // ---------- GEOCODING HELPERS ----------
        function geocodeJob(jobId) {
            const job = jobs[jobId];
            if (!job) return Promise.reject("Job not found");
            if (job.lat && job.lng) return Promise.resolve({ lat: job.lat, lng: job.lng });
            const address = job.pickup_location + ', ' + job.city;
            const geocoder = new google.maps.Geocoder();
            return new Promise((resolve, reject) => {
                geocoder.geocode({ address: address, region: 'ca' }, (results, status) => {
                    if (status === 'OK' && results.length > 0) {
                        const loc = results[0].geometry.location;
                        const lat = loc.lat();
                        const lng = loc.lng();
                        db.ref(`developer/route_planner/jobs/${jobId}/lat`).set(lat);
                        db.ref(`developer/route_planner/jobs/${jobId}/lng`).set(lng);
                        // Update local copy
                        job.lat = lat;
                        job.lng = lng;
                        resolve({ lat, lng });
                    } else {
                        reject("Geocode failed for " + address);
                    }
                });
            });
        }

        function ensureAllJobsGeocoded() {
            const pendingIds = Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup');
            const needsGeocode = pendingIds.filter(id => !jobs[id].lat || !jobs[id].lng);
            if (needsGeocode.length === 0) return Promise.resolve();
            // Geocode in parallel
            const promises = needsGeocode.map(id => geocodeJob(id).catch(err => console.warn(err)));
            return Promise.all(promises);
        }

        // ---------- ROUTE STATE PERSISTENCE ----------
        function saveRouteState() {
            if (!currentUser) return;
            const stateRef = db.ref(`developer/route_planner/route_state/${currentRouteKey}`);
            stateRef.set({
                order: routeState.order,
                isFinalized: routeState.isFinalized,
                assignedIndices: routeState.assignedIndices
            }).catch(err => console.warn("Save route state error:", err));
            // Always save to saved_routes with full data
            const stops = routeState.order.map(id => jobs[id]).filter(j => j);
            const routeData = {
                label: currentUser,
                timestamp: Date.now(),
                order: routeState.order,
                assignedIndices: routeState.assignedIndices,
                isFinalized: routeState.isFinalized,
                stops: stops,
                etaTotalMinutes: etaTotalMinutes,
                etaTotalKm: etaTotalKm
            };
            db.ref(`developer/route_planner/saved_routes/${currentRouteKey}`).set(routeData).catch(err => console.warn("Save saved route error:", err));
        }

        // ---------- LOAD ROUTE STATE (FIXED) ----------
        function loadRouteState() {
            if (!currentUser) return;
            const savedRef = db.ref(`developer/route_planner/saved_routes/${currentRouteKey}`);
            savedRef.once('value').then(snap => {
                const saved = snap.val();
                if (saved && (saved.order || saved.stops)) {
                    // 1) Try to restore from saved.order (array of IDs)
                    let orderArr = saved.order ? (Array.isArray(saved.order) ? saved.order : Object.values(saved.order)) : [];
                    // Filter to only IDs that currently exist in jobs
                    let validOrder = orderArr.filter(id => jobs[id]);
                    if (validOrder.length > 0) {
                        // Use the valid order
                        routeState.order = validOrder;
                        routeState.isFinalized = saved.isFinalized || false;
                        const newAssigned = {};
                        routeState.order.forEach((id, i) => newAssigned[id] = i+1);
                        routeState.assignedIndices = newAssigned;
                        if (saved.etaTotalMinutes !== undefined) {
                            etaTotalMinutes = saved.etaTotalMinutes;
                            etaTotalKm = saved.etaTotalKm || 0;
                        }
                        // Do NOT call saveRouteState() here to avoid overwriting with empty data
                        updateUI();
                        updateETADisplay();
                        return;
                    }

                    // 2) If order is empty or invalid, try to use saved.stops to recreate jobs
                    let stopsArr = saved.stops ? (Array.isArray(saved.stops) ? saved.stops : Object.values(saved.stops)) : [];
                    if (stopsArr.length > 0) {
                        // Clear existing jobs before recreating
                        db.ref('developer/route_planner/jobs').remove();
                        // Create new jobs from stops data
                        const newPromises = stopsArr.map(stop => {
                            const newJob = {
                                name: stop.name || '',
                                pickup_location: stop.pickup_location || '',
                                city: stop.city || '',
                                status: 'pending_pickup',
                                timestamp: stop.timestamp || Date.now(),
                                created_by: stop.created_by || currentUser,
                                box_qty: stop.box_qty || 0,
                                piece_qty: stop.piece_qty || 0,
                                envelope_qty: stop.envelope_qty || 0,
                                skid_qty: stop.skid_qty || 0,
                                weight_lbs: stop.weight_lbs || 0,
                                other_details: stop.other_details || ''
                            };
                            const newRef = db.ref('developer/route_planner/jobs').push();
                            return newRef.set(newJob).then(() => newRef.key);
                        });
                        Promise.all(newPromises).then(newIds => {
                            // After all new jobs are created, set the order and indices
                            routeState.order = newIds;
                            routeState.isFinalized = saved.isFinalized || true; // assume finalized after load
                            const newAssigned = {};
                            routeState.order.forEach((id, i) => newAssigned[id] = i+1);
                            routeState.assignedIndices = newAssigned;
                            if (saved.etaTotalMinutes !== undefined) {
                                etaTotalMinutes = saved.etaTotalMinutes;
                                etaTotalKm = saved.etaTotalKm || 0;
                            }
                            // Now save the new state so future loads use IDs
                            saveRouteState();
                            updateUI();
                            updateETADisplay();
                        }).catch(err => console.warn("Error recreating jobs from saved stops:", err));
                        return;
                    }
                }

                // 3) Fallback to route_state
                db.ref(`developer/route_planner/route_state/${currentRouteKey}`).once('value').then(snap2 => {
                    const data = snap2.val();
                    if (data) {
                        let orderArr = data.order ? (Array.isArray(data.order) ? data.order : Object.values(data.order)) : [];
                        routeState.order = orderArr.filter(id => jobs[id]);
                        routeState.isFinalized = data.isFinalized || false;
                        const newAssigned = {};
                        routeState.order.forEach((id, i) => newAssigned[id] = i+1);
                        routeState.assignedIndices = newAssigned;
                        // Do NOT call saveRouteState() here
                    } else {
                        routeState.order = [];
                        routeState.isFinalized = false;
                        routeState.assignedIndices = {};
                    }
                    updateUI();
                    updateETADisplay();
                });
            });
        }

        // ---------- UI UPDATE ----------

            // ETA display
