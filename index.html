        }

        // ---------- RENDER LIST ----------
        function renderList() {
            const container = document.getElementById('job-list');
            const emptyState = document.getElementById('empty-state');
            const pendingJobs = Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup');
            if (pendingJobs.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            let displayOrder = [];
            if (routeState.isFinalized && routeState.order.length > 0) {
                displayOrder = routeState.order.filter(id => jobs[id] && jobs[id].status === 'pending_pickup');
                const existingFinal = new Set(displayOrder);
                const extraFinal = pendingJobs.filter(id => !existingFinal.has(id));
                displayOrder = displayOrder.concat(extraFinal);
            } else {
                if (routeState.order.length > 0) {
                    displayOrder = routeState.order.filter(id => jobs[id] && jobs[id].status === 'pending_pickup');
                    const existing = new Set(displayOrder);
                    const extra = pendingJobs.filter(id => !existing.has(id));
                    displayOrder = displayOrder.concat(extra);
                } else {
                    displayOrder = pendingJobs.sort((a,b) => jobs[a].timestamp - jobs[b].timestamp);
                }
            }

            let html = '';
            displayOrder.forEach(id => {
                const job = jobs[id];
                if (!job) return;
                const number = routeState.assignedIndices[id] || null;
                const isPending = number === null;
                const pendingClass = isPending ? 'pending' : '';
                const numberDisplay = number !== null ? number : '';
                html += `
                    <div class="job-item ${pendingClass}" data-id="${id}" onclick="openJobInMaps('${id}')">
                        <span class="job-number">${numberDisplay}</span>
                        <div class="job-info">
                            <div class="job-name">${job.name || 'No name'}</div>
                            <div class="job-address">${job.pickup_location || ''}, ${job.city || ''}</div>
                        </div>
                        <svg class="delete-icon" viewBox="0 0 24 24" onclick="deleteJob('${id}'); event.stopPropagation();">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ---------- MAP MARKERS ----------
        function updateMapMarkers() {
            if (!map) return;
            // Clear existing markers
            Object.values(mapMarkers).forEach(m => m.setMap(null));
            mapMarkers = {};
            stopPulsingAll();

            const pendingJobs = Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup');
            if (pendingJobs.length === 0) return;

            const isOrdering = isOrderingMode;
            const isFinal = routeState.isFinalized;

            pendingJobs.forEach(id => {
                const job = jobs[id];
                const lat = job.lat;
                const lng = job.lng;
                if (!lat || !lng) return; // skip if not geocoded yet

                const number = routeState.assignedIndices[id] || null;
                const isAssigned = number !== null;
                let labelText = isAssigned ? `${number}. ${job.name || ''}` : job.name || '';

                let marker;
                if (isFinal) {
                    // For unassigned jobs, display with larger gold label
                    let labelOptions;
                    if (number === null) {
                        labelOptions = {
                            text: labelText,
                            color: '#FFD700',
                            fontWeight: 'bold',
                            fontSize: '16px',
                            className: 'driver-map-label'
                        };
                    } else {
                        labelOptions = {
                            text: labelText,
                            color: '#00b32d',
                            fontWeight: 'bold',
                            fontSize: '12px',
                            className: 'driver-map-label'
                        };
                    }
                    marker = new google.maps.Marker({
                        position: { lat, lng },
                        map: map,
                        label: labelOptions,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 14,
                            fillColor: '#ff9800',
                            fillOpacity: 1,
                            strokeColor: 'white',
                            strokeWeight: 2
                        }
                    });
                } else if (isOrdering) {
                    if (isAssigned) {
                        marker = new google.maps.Marker({
                            position: { lat, lng },
                            map: map,
                            label: {
                                text: labelText,
                                color: '#00b32d',
                                fontWeight: 'bold',
                                fontSize: '12px',
                                className: 'driver-map-label'
                            },
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 14,
                                fillColor: '#ff9800',
                                fillOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 2
                            }
                        });
                    } else {
                        // Unassigned: pulsing blue with gold label
                        marker = new google.maps.Marker({
                            position: { lat, lng },
                            map: map,
                            label: {
                                text: labelText,
                                color: '#ff9800',
                                fontWeight: 'bold',
                                fontSize: '18px',
                                className: 'driver-map-label-pending'
                            },
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 20,
                                fillColor: '#2196F3',
                                fillOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 2
                            }
                        });
                        const circle = new google.maps.Circle({
                            map: map,
                            center: { lat, lng },
                            radius: 20,
                            fillColor: '#2196F3',
                            fillOpacity: 0.4,
                            strokeColor: '#2196F3',
                            strokeWeight: 2,
                            strokeOpacity: 0.7
                        });
                        let growing = true;
                        let markerScale = 20;
                        const interval = setInterval(() => {
                            let rad = circle.getRadius();
                            if (growing) { rad += 3; if (rad > 45) growing = false; }
                            else { rad -= 3; if (rad < 15) growing = true; }
                            circle.setRadius(rad);
                            let op = circle.getFillOpacity();
                            if (growing) op = Math.min(op + 0.05, 0.8);
                            else op = Math.max(op - 0.05, 0.2);
                            circle.setFillOpacity(op);
                            circle.setStrokeOpacity(op);
                            markerScale = growing ? Math.min(markerScale + 0.6, 27) : Math.max(markerScale - 0.6, 20);
                            marker.setIcon({
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: markerScale,
                                fillColor: '#2196F3',
                                fillOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 2
                            });
                        }, 60);
                        pulsingMarkers[id] = { marker, circle, interval };
                        marker.addListener('click', () => assignNumber(id));
                    }
                } else {
                    // Not in ordering mode, not finalized: show unnumbered orange
                    marker = new google.maps.Marker({
                        position: { lat, lng },
                        map: map,
                        label: {
                            text: labelText,
                            color: '#00b32d',
                            fontWeight: 'bold',
                            fontSize: '12px',
                            className: 'driver-map-label'
                        },
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 14,
                            fillColor: '#ff9800',
                            fillOpacity: 1,
                            strokeColor: 'white',
                            strokeWeight: 2
                        }
                    });
                }
                mapMarkers[id] = marker;
            });
        }

        // ---------- POLYLINE ----------
        function updatePolyline() {
            if (!map) return;
            if (activePolyline) { activePolyline.setMap(null); activePolyline = null; }
            // Clear arrow markers
            arrowMarkers.forEach(m => m.setMap(null));
            arrowMarkers = [];
            // removed originMarker removal and creation, now it's permanent
            if (routeState.order.length === 0) return;
            if (!routeState.isFinalized && !isOrderingMode) return;

            const origin = { lat: 49.8425, lng: -99.9497 };
            const path = [origin];
            routeState.order.forEach(id => {
                const job = jobs[id];
                if (job && job.lat && job.lng) {
                    path.push({ lat: job.lat, lng: job.lng });
                }
            });
            path.push(origin);

            if (path.length > 1) {
                activePolyline = new google.maps.Polyline({
                    path: path,
                    geodesic: true,
                    strokeColor: "#00d4ff",
                    strokeOpacity: 0.8,
                    strokeWeight: 6,
                    map: map
                });

                // Add directional arrows (two per segment)
                const arrowColor = "#00d4ff";
                const arrowSymbol = {
                    path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                    fillColor: arrowColor,
                    fillOpacity: 1,
                    strokeColor: '#000000',
                    strokeWeight: 1,
                    scale: 4
                };
                const pathArray = activePolyline.getPath().getArray();
                for (let i = 0; i < pathArray.length - 1; i++) {
                    const p1 = pathArray[i];
                    const p2 = pathArray[i+1];
                    const dist = google.maps.geometry.spherical.computeDistanceBetween(p1, p2);
                    if (dist < 10) continue; // skip tiny segments
                    const heading = google.maps.geometry.spherical.computeHeading(p1, p2);
                    // place at 1/3 and 2/3
                    const frac1 = 1/3, frac2 = 2/3;
                    const pos1 = google.maps.geometry.spherical.computeOffset(p1, dist * frac1, heading);
                    const pos2 = google.maps.geometry.spherical.computeOffset(p1, dist * frac2, heading);
                    const arrowMarker1 = new google.maps.Marker({
                        position: pos1,
                        map: map,
                        icon: { ...arrowSymbol, rotation: heading },
                        clickable: false
                    });
                    const arrowMarker2 = new google.maps.Marker({
                        position: pos2,
                        map: map,
                        icon: { ...arrowSymbol, rotation: heading },
                        clickable: false
                    });
                    arrowMarkers.push(arrowMarker1, arrowMarker2);
                }
            }
        }

        // ---------- ORDERING MODE ----------
        function startCreateRoute() {
            const pendingJobs = Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup');
            if (pendingJobs.length === 0) {
                alert("No stops to route.");
                return;
            }

            // Ensure all jobs have coordinates before entering ordering mode
            ensureAllJobsGeocoded().then(() => {
                if (routeState.isFinalized) {
                    if (!confirm("Are you sure you want to clear the current order and restart?")) return;
                    routeState.isFinalized = false;
                    routeState.assignedIndices = {};
                    routeState.order = [];
                    saveRouteState();
                    updateUI();
                }

                if (isOrderingMode) {
                    // Reset: clear all assignments, stop pulsing
                    routeState.assignedIndices = {};
                    routeState.order = [];
                    stopPulsingAll();
                    isOrderingMode = false;
                    saveRouteState();
                    updateUI();
                }

                isOrderingMode = true;
                if (!document.getElementById('map-modal').style.display || document.getElementById('map-modal').style.display === 'none') {
                    openMap(true);
                }
                // Zoom to all waypoints
                zoomToAllWaypoints();
                updateUI();
                if (createRouteMainBtn) createRouteMainBtn.classList.add('active');
                if (createRouteMapBtn) createRouteMapBtn.classList.add('active');
            });
        }

        function zoomToAllWaypoints() {
            const bounds = new google.maps.LatLngBounds();
            bounds.extend({ lat: 49.8425, lng: -99.9497 });
            let hasJob = false;
            const pendingIds = Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup');
            pendingIds.forEach(id => {
                const job = jobs[id];
                if (job.lat && job.lng) {
                    bounds.extend({ lat: job.lat, lng: job.lng });
                    hasJob = true;
                }
            });
            if (map) {
                if (hasJob) {
                    map.fitBounds(bounds);
                } else {
                    map.setCenter({ lat: 49.8425, lng: -99.9497 });
                    map.setZoom(12);
                }
            }
        }

        function assignNumber(jobId) {
            if (!isOrderingMode) return;
            if (routeState.assignedIndices[jobId]) return;
            if (!jobs[jobId] || jobs[jobId].status !== 'pending_pickup') return;

            const assignedIds = Object.keys(routeState.assignedIndices);
            const nextNumber = assignedIds.length + 1;
            routeState.assignedIndices[jobId] = nextNumber;
            routeState.order.push(jobId);

            if (pulsingMarkers[jobId]) {
                clearInterval(pulsingMarkers[jobId].interval);
                if (pulsingMarkers[jobId].circle) pulsingMarkers[jobId].circle.setMap(null);
                const marker = pulsingMarkers[jobId].marker;
                const job = jobs[jobId];
                marker.setLabel({
                    text: `${nextNumber}. ${job.name || ''}`,
                    color: '#00b32d',
                    fontWeight: 'bold',
                    fontSize: '12px',
                    className: 'driver-map-label'
                });
                marker.setIcon({
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 14,
                    fillColor: '#ff9800',
                    fillOpacity: 1,
                    strokeColor: 'white',
                    strokeWeight: 2
                });
                delete pulsingMarkers[jobId];
            }

            saveRouteState();
            renderList();
            updatePolyline();

            const pendingIds = Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup');
            const assignedIdsNow = Object.keys(routeState.assignedIndices);
            if (pendingIds.length === assignedIdsNow.length) {
                finalizeRoute();
            }
        }

        function finalizeRoute() {
            routeState.isFinalized = true;
            isOrderingMode = false;
            stopPulsingAll();
            updateUI();
            updatePolyline();
            saveRouteState();
            if (createRouteMainBtn) createRouteMainBtn.classList.remove('active');
            if (createRouteMapBtn) createRouteMapBtn.classList.remove('active');
            if (map && activePolyline) {
                const bounds = new google.maps.LatLngBounds();
                activePolyline.getPath().forEach(p => bounds.extend(p));
                map.fitBounds(bounds);
            }
            if (etaTotalMinutes > 0) updateETADisplay();
        }

        function stopPulsingAll() {
            Object.values(pulsingMarkers).forEach(p => {
                if (p.interval) clearInterval(p.interval);
                if (p.circle) p.circle.setMap(null);
                if (p.marker) {
                    // Reset to default (orange)
                    p.marker.setIcon({
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 14,
                        fillColor: '#ff9800',
                        fillOpacity: 1,
                        strokeColor: 'white',
                        strokeWeight: 2
                    });
                    const job = jobs[Object.keys(pulsingMarkers).find(k => pulsingMarkers[k] === p)];
                    if (job) {
                        p.marker.setLabel({
                            text: job.name || '',
                            color: '#00b32d',
                            fontWeight: 'bold',
                            fontSize: '12px',
                            className: 'driver-map-label'
                        });
                    }
                }
            });
            pulsingMarkers = {};
        }

        // ---------- ADD JOB ----------
        function addJob() {
            const name = document.getElementById('f-name').value.trim();
            const address = document.getElementById('f-address').value.trim();
            const city = document.getElementById('f-city').value.trim();
            if (!name || !address || !city) { alert("Please fill in all fields."); return; }
            const newJob = {
                name: name,
                pickup_location: address,
                city: city,
                status: 'pending_pickup',
                timestamp: Date.now(),
                created_by: currentUser,
                box_qty: 0, piece_qty: 0, envelope_qty: 0, skid_qty: 0, weight_lbs: 0, other_details: ''
            };
            const newJobRef = db.ref('developer/route_planner/jobs').push();
            newJobRef.set(newJob).then(() => {
                const sanitizedKey = name.replace(/[.#$\[\]\/]/g, "").trim();
                db.ref("address_lookup").child(sanitizedKey).update({
                    address: address,
                    city: city,
                    last_edit_by: currentUser
                });
                resetFormFields();
                // Geocode the new job after it's added (listener will trigger)
            }).catch(err => alert("Error adding job: " + err.message));
        }

        // ---------- AUTO-INSERTION (removed - no longer used) ----------
        // function autoInsertNewStop() { ... } // removed

        // ---------- DELETE JOB ----------
        function deleteJob(id) {
            if (confirm("Remove this stop from route?")) {
                db.ref(`developer/route_planner/jobs/${id}`).remove();
                // Update state if needed
                if (routeState.isFinalized) {
                    const idx = routeState.order.indexOf(id);
                    if (idx !== -1) {
                        routeState.order.splice(idx, 1);
                        const newAssigned = {};
                        routeState.order.forEach((id2, i) => { newAssigned[id2] = i + 1; });
                        routeState.assignedIndices = newAssigned;
                        if (routeState.order.length === 0) routeState.isFinalized = false;
                        saveRouteState();
                        updateUI();
                        updatePolyline();
                    }
                } else {
                    delete routeState.assignedIndices[id];
                    const idx = routeState.order.indexOf(id);
                    if (idx !== -1) routeState.order.splice(idx, 1);
                    saveRouteState();
                    updateUI();
                }
            }
        }

        // ---------- OPEN JOB IN MAPS ----------
        function openJobInMaps(jobId) {
            const job = jobs[jobId];
            if (!job) return;
            const address = `${job.pickup_location}, ${job.city}`;
            const encoded = encodeURIComponent(address);
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent)) {
                window.location.href = `intent://maps.google.com/maps?daddr=${encoded}&directionsmode=driving#Intent;scheme=https;package=com.google.android.apps.maps;end`;
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = `comgooglemaps://?daddr=${encoded}&directionsmode=driving`;
            } else {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${encoded}&travelmode=driving`, '_blank');
            }
        }

        // ---------- UPDATE CREATE ROUTE BUTTON ----------
        function updateCreateRouteButton() {
            const pending = Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup');
            const hasStops = pending.length > 0;
            const isFinal = routeState.isFinalized;
            const isOrdering = isOrderingMode;

            [createRouteMainBtn, createRouteMapBtn].forEach(btn => {
                if (!btn) return;
                // Map button is never disabled (unless no stops? but we allow click)
                if (btn.id === 'create-route-map') {
                    btn.disabled = false;
                    // Manage classes for map button
                    if (!hasStops) {
                        btn.classList.remove('pulse-glow', 'active');
                    } else {
                        if (isOrdering) {
                            btn.classList.add('active', 'pulse-glow');
                        } else {
                            btn.classList.remove('pulse-glow', 'active');
                        }
                    }
                } else {
                    // Main page button: disabled only when no stops
                    if (!hasStops) {
                        btn.disabled = true;
                        btn.classList.remove('pulse-glow', 'active');
                    } else {
                        btn.disabled = false;
                        if (!isFinal && !isOrdering) {
                            btn.classList.add('pulse-glow');
                            btn.classList.remove('active');
                        } else if (isOrdering) {
                            btn.classList.add('active', 'pulse-glow');
                        } else {
                            btn.classList.remove('pulse-glow', 'active');
                        }
                    }
                }
            });
        }

        // ---------- MAP FUNCTIONS ----------
        function initMap() {
            if (!google.maps) return;
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 49.8425, lng: -99.9497 },
                zoom: 12,
                gestureHandling: 'greedy',
                styles: document.body.classList.contains('light-mode') ? [] : mapStyles
            });
            mainMap = map;

            // Create permanent origin marker
            originMarker = new google.maps.Marker({
                position: { lat: 49.8425, lng: -99.9497 },
                map: map,
                title: '1604 Moreland Ave (Origin)'
            });

            // Bullseye button removed as per request

            initAddressPickerMap();
            updateUI();
        }

        function openMap(zoomToAll) {
            document.getElementById('map-modal').style.display = 'block';
            setTimeout(() => {
                google.maps.event.trigger(map, 'resize');
                if (zoomToAll) {
                    zoomToAllWaypoints();
                } else if (routeState.isFinalized && activePolyline) {
                    const bounds = new google.maps.LatLngBounds();
                    activePolyline.getPath().forEach(p => bounds.extend(p));
                    map.fitBounds(bounds);
                } else {
                    map.setCenter({ lat: 49.8425, lng: -99.9497 });
                    map.setZoom(12);
                }
                updateUI(); // refresh markers after resize
            }, 100);
        }

        function closeMap() {
            document.getElementById('map-modal').style.display = 'none';
        }

        function zoomToAll() {
            if (activePolyline) {
                const bounds = new google.maps.LatLngBounds();
                activePolyline.getPath().forEach(p => bounds.extend(p));
                map.fitBounds(bounds);
            }
        }
        function resetMapView() { zoomToAll(); }

        // ---------- ETA ----------
        async function calculateETAOnDemand() {
            let order = [];
            if (routeState.isFinalized && routeState.order.length > 0) {
                order = routeState.order;
            } else {
                order = Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup').sort((a,b) => jobs[a].timestamp - jobs[b].timestamp);
            }
            if (order.length === 0) { alert("No stops."); return; }

            const etaBtn = document.getElementById('eta-btn');
            etaBtn.disabled = true;
            etaBtn.classList.add('eta-spin');
            etaCalculating = true;
            try {
                const origin = "1604 Moreland Ave, Brandon MB";
                const destination = "1604 Moreland Ave, Brandon MB";
                const waypoints = order.map(id => ({ address: `${jobs[id].pickup_location}, ${jobs[id].city}` }));
                const response = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Goog-Api-Key": "AIzaSyA6umETP8wBUEV41ugAtiNiChUeLmmwmZI",
                        "X-Goog-FieldMask": "routes.duration,routes.distanceMeters,routes.legs.duration,routes.legs.distanceMeters"
                    },
                    body: JSON.stringify({
                        origin: { address: origin },
                        destination: { address: destination },
                        intermediates: waypoints,
                        travelMode: "DRIVE",
                        optimizeWaypointOrder: false
                    })
                });
                const data = await response.json();
                if (data.routes && data.routes[0]) {
                    const route = data.routes[0];
                    let totalDurationSeconds = 0, totalDistanceMeters = 0;
                    if (route.legs) {
                        route.legs.forEach(leg => {
                            totalDurationSeconds += parseFloat(leg.duration.replace('s', ''));
                            totalDistanceMeters += parseFloat(leg.distanceMeters);
                        });
                    } else {
                        totalDurationSeconds = parseFloat(route.duration.replace('s', ''));
                        totalDistanceMeters = parseFloat(route.distanceMeters);
                    }
                    etaTotalMinutes = totalDurationSeconds / 60;
                    etaTotalKm = totalDistanceMeters / 1000;
                    updateETADisplay();
                    document.getElementById('eta-display').style.display = 'block';
                    document.getElementById('eta-display').classList.add('eta-glow');
                    saveRouteState(); // Save updated ETA
                } else {
                    alert("Could not calculate ETA.");
                }
            } catch(e) { console.error(e); alert("Error calculating ETA."); }
            finally {
                etaCalculating = false;
                etaBtn.disabled = false;
                etaBtn.classList.remove('eta-spin');
            }
        }

        function updateETADisplay() {
            const etaTime = document.getElementById('eta-time');
            const etaAdjusted = document.getElementById('eta-adjusted');
            const etaAdjustedTime = document.getElementById('eta-adjusted-time');
            const etaDistance = document.getElementById('eta-distance');
            const totalMinutes = etaTotalMinutes;
            const hours = Math.floor(totalMinutes / 60);
            const mins = Math.round(totalMinutes % 60);
            let timeStr = '';
            if (hours > 0) timeStr += hours + 'h ';
            timeStr += mins + 'm';
            etaTime.textContent = timeStr;
            const stops = routeState.order.length || Object.keys(jobs).filter(id => jobs[id].status === 'pending_pickup').length;
            const adjustedMinutes = totalMinutes + 3 * stops;
            const adjHours = Math.floor(adjustedMinutes / 60);
            const adjMins = Math.round(adjustedMinutes % 60);
            let adjStr = '';
            if (adjHours > 0) adjStr += adjHours + 'h ';
            adjStr += adjMins + 'm';
            etaAdjustedTime.textContent = adjStr;
            etaAdjusted.style.display = 'inline';
            etaDistance.textContent = etaTotalKm.toFixed(1);
        }

        // ---------- EXTERNAL ROUTE ----------
        function openExternalRoute() {
            if (routeState.order.length === 0) {
                alert("No stops to route.");
                return;
            }
            if (!confirm("Note: This will route only the first 10 stops.\nProceed?")) return;
            const origin = "1604 Moreland Ave, Brandon MB";
            const destination = "1604 Moreland Ave, Brandon MB";
            const seenLocs = new Set();
            const maxStops = 10;
            let stopsAdded = 0;
            const waypoints = routeState.order.map(id => {
                if (stopsAdded >= maxStops) return "";
                const job = jobs[id];
                if (!job) return "";
                const key = `${job.pickup_location}, ${job.city}`;
                if (seenLocs.has(key)) return "";
                seenLocs.add(key);
                stopsAdded++;
                return encodeURIComponent(key);
            }).filter(w => w !== "").join("|");
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent)) {
                window.location.href = `intent://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&waypoints=${waypoints}&travelmode=driving#Intent;scheme=https;package=com.google.android.apps.maps;end`;
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = `comgooglemaps://?saddr=${encodeURIComponent(origin)}&daddr=${encodeURIComponent(destination)}&waypoints=${waypoints}&directionsmode=driving`;
            } else {
                window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&waypoints=${waypoints}&travelmode=driving`, '_blank');
            }
        }

        // ---------- ADDRESS PICKER (unchanged) ----------
        function initAddressPickerMap() {
            if (pickerInitialized) return;
            const container = document.getElementById('picker-map');
            if (!container || !google.maps) return;
            const defaultCenter = { lat: 49.8425, lng: -99.9497 };
            pickerMap = new google.maps.Map(container, {
                center: defaultCenter,
                zoom: 12,
                mapTypeId: 'roadmap',
                styles: mapStyles,
                gestureHandling: 'greedy'
            });
            pickerGeocoder = new google.maps.Geocoder();
            pickerMarker = new google.maps.Marker({
                position: defaultCenter,
                map: pickerMap,
                draggable: true,
                animation: google.maps.Animation.DROP,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 8,
                    fillColor: '#ff9800',
                    fillOpacity: 1,
                    strokeColor: '#ffffff',
                    strokeWeight: 2
                }
            });
            pickerMarker.addListener('dragend', function() {
                const pos = pickerMarker.getPosition();
                updatePickerInfo(pos.lat(), pos.lng());
            });
            pickerMap.addListener('click', function(e) {
                const lat = e.latLng.lat();
                const lng = e.latLng.lng();
                pickerMarker.setPosition({ lat, lng });
                updatePickerInfo(lat, lng);
            });
            const searchInput = document.getElementById('picker-search');
            if (searchInput) {
                pickerAutocomplete = new google.maps.places.Autocomplete(searchInput, {
                    types: ['geocode'],
                    componentRestrictions: { country: 'ca' }
                });
                pickerAutocomplete.addListener('place_changed', function() {
                    const place = pickerAutocomplete.getPlace();
                    if (!place.geometry) return;
                    const location = place.geometry.location;
                    const lat = location.lat();
                    const lng = location.lng();
                    pickerMap.panTo({ lat, lng });
                    pickerMap.setZoom(14);
                    pickerMarker.setPosition({ lat, lng });
                    updatePickerInfo(lat, lng);
                });
            }
            updatePickerInfo(defaultCenter.lat, defaultCenter.lng);
            pickerInitialized = true;
        }

        function openAddressPicker() {
            document.getElementById('address-picker-modal').style.display = 'block';
            if (!pickerInitialized) initAddressPickerMap();
            setTimeout(() => {
                if (pickerMap) {
                    google.maps.event.trigger(pickerMap, 'resize');
                    const pos = pickerMarker.getPosition();
                    if (pos) pickerMap.setCenter(pos);
                }
            }, 100);
            document.getElementById('picker-search').value = '';
            if (pickerMarker) {
                const pos = pickerMarker.getPosition();
                if (pos) updatePickerInfo(pos.lat(), pos.lng());
            }
        }

        function closeAddressPicker() {
            document.getElementById('address-picker-modal').style.display = 'none';
        }

        function updatePickerInfo(lat, lng) {
            const latLng = { lat, lng };
            pickerGeocoder.geocode({ location: latLng }, function(results, status) {
                let address = '', plusCode = '';
                if (status === 'OK' && results.length > 0) {
                    address = results[0].formatted_address || '';
                    for (let result of results) {
                        if (result.plus_code) {
                            plusCode = result.plus_code.compound_code || result.plus_code.global_code || '';
                            break;
                        }
                    }
                } else {
                    address = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
                }
                if (!plusCode) {
                    for (let result of results) {
                        if (result.address_components) {
                            for (let comp of result.address_components) {
                                if (comp.types && comp.types.includes('plus_code')) {
                                    plusCode = comp.long_name || comp.short_name || '';
                                    break;
                                }
                            }
                        }
                        if (plusCode) break;
                    }
                }
                selectedLocation = { lat, lng, address, plusCode: plusCode || '' };
                document.getElementById('picker-address-display').textContent = address || 'Address not found';
                document.getElementById('picker-pluscode-display').textContent = plusCode ? `Plus Code: ${plusCode}` : 'Plus Code: —';
            });
        }

        function searchAddressPicker() {
            const input = document.getElementById('picker-search');
            const query = input.value.trim();
            if (!query) return;
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: query, region: 'ca' }, function(results, status) {
                if (status === 'OK' && results.length > 0) {
                    const location = results[0].geometry.location;
                    const lat = location.lat();
                    const lng = location.lng();
                    pickerMap.panTo({ lat, lng });
                    pickerMap.setZoom(14);
                    pickerMarker.setPosition({ lat, lng });
                    updatePickerInfo(lat, lng);
                } else {
                    alert('Location not found.');
                }
            });
        }

        function confirmAddress() {
            if (!selectedLocation) { alert("No location selected."); return; }
            let addressToUse = selectedLocation.address || selectedLocation.plusCode;
            if (!addressToUse) { alert("Could not determine address."); return; }
            document.getElementById('f-address').value = addressToUse;
            closeAddressPicker();
        }

        // ---------- TRACKING (removed bullseye control, but keep functions for safety) ----------
        function startTracking() {
            if (!navigator.geolocation) { alert("Geolocation not supported."); return; }
            const btn = document.getElementById('bullseye-btn');
            if (btn) btn.classList.add('active');
            isTracking = true;
            locationWatchId = navigator.geolocation.watchPosition(
                function(pos) {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    const loc = new google.maps.LatLng(lat, lng);
                    if (userMarker) userMarker.setMap(null);
                    if (userCircle) { if (userCircle._pulseInterval) clearInterval(userCircle._pulseInterval); userCircle.setMap(null); }
                    userCircle = new google.maps.Circle({
                        map: map,
                        center: loc,
                        radius: 20,
                        fillColor: '#ff6600',
                        fillOpacity: 0.5,
                        strokeColor: '#ff6600',
                        strokeWeight: 2,
                        strokeOpacity: 0.8
                    });
                    let pulseInterval = setInterval(function() {
                        if (!userCircle) { clearInterval(pulseInterval); return; }
                        let rad = userCircle.getRadius();
                        let newRad = rad + 5;
                        if (newRad > 40) newRad = 20;
                        userCircle.setRadius(newRad);
                        let op = userCircle.getFillOpacity();
                        let newOp = (op === 0.5) ? 0.8 : 0.5;
                        userCircle.setFillOpacity(newOp);
                    }, 500);
                    userCircle._pulseInterval = pulseInterval;
                    userMarker = new google.maps.Marker({
                        position: loc,
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 8,
                            fillColor: '#ff6600',
                            fillOpacity: 1,
                            strokeColor: '#fff',
                            strokeWeight: 2
                        }
                    });
                    map.panTo(loc);
                    map.setZoom(15);
                },
                function(err) {
                    console.error(err);
                    alert("Unable to get location: " + err.message);
                    stopTracking();
                },
                { enableHighAccuracy: true, maximumAge: 10000 }
            );
        }

        function stopTracking() {
            if (locationWatchId) { navigator.geolocation.clearWatch(locationWatchId); locationWatchId = null; }
            if (userMarker) { userMarker.setMap(null); userMarker = null; }
            if (userCircle) { if (userCircle._pulseInterval) clearInterval(userCircle._pulseInterval); userCircle.setMap(null); userCircle = null; }
            isTracking = false;
            const btn = document.getElementById('bullseye-btn');
            if (btn) btn.classList.remove('active');
            if (routeState.isFinalized && activePolyline) {
                const bounds = new google.maps.LatLngBounds();
                activePolyline.getPath().forEach(p => bounds.extend(p));
                map.fitBounds(bounds);
            } else {
                map.setCenter({ lat: 49.8425, lng: -99.9497 });
                map.setZoom(12);
            }
        }

        // ---------- ADDRESS AUTOCOMPLETE ----------
        function handleNameInput(val) {
            showSuggestions(val, 'suggestions', name => `<div class="suggestion-item" onclick="selectClient('${name.replace(/'/g, "\\'")}')">${name}</div>`);
        }
        function handleCityInput(val) {
            showSuggestions(val, 'city-suggestions', city => `<div class="suggestion-item" onclick="selectCity('${city.replace(/'/g, "\\'")}')">${city} (${addressData[city]?.city})</div>`);
        }
        function showSuggestions(val, elementId, htmlCallback) {
            const box = document.getElementById(elementId);
            if (val.length < 1) { box.style.display = 'none'; return; }
            const matches = Object.keys(addressData).filter(key => key.toLowerCase().startsWith(val.toLowerCase().trim()));
            if (matches.length === 0) { box.style.display = 'none'; return; }
            box.innerHTML = matches.map(htmlCallback).join('');
            box.style.display = 'block';
        }
        function selectClient(name) {
            const data = addressData[name];
            if (!data) return;
            document.getElementById('f-name').value = name;
            document.getElementById('f-address').value = data.address || '';
            document.getElementById('f-city').value = data.city || '';
            document.getElementById('suggestions').style.display = 'none';
        }
        function selectCity(city) {
            document.getElementById('f-city').value = city;
            document.getElementById('city-suggestions').style.display = 'none';
        }
        function resetFormFields() {
            document.getElementById('f-name').value = '';
            document.getElementById('f-address').value = '';
            document.getElementById('f-city').value = '';
        }

        function initPlaces() {
            const addressInput = document.getElementById('f-address');
            if (!addressInput) return;
            const options = {
                componentRestrictions: { country: 'ca' },
                bounds: new google.maps.Circle({ center: new google.maps.LatLng(49.848, -99.950), radius: 50000 }).getBounds(),
                strictBounds: false
            };
            autocompleteAddress = new google.maps.places.Autocomplete(addressInput, options);
            autocompleteAddress.addListener('place_changed', () => {
                const place = autocompleteAddress.getPlace();
                if (!place.address_components) return;
                for (let comp of place.address_components) {
                    if (comp.types.includes('locality')) {
                        document.getElementById('f-city').value = comp.long_name;
                        break;
                    }
                }
            });
        }

        // ---------- PWA INSTALL ----------
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').style.display = 'block';
        });
        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') deferredPrompt = null;
                document.getElementById('install-btn').style.display = 'none';
            }
        });
    </script>
